name: Android APK
on:
  workflow_dispatch:
    inputs:
      arch: { description: 'ABI', required: false, default: 'arm64' }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Setup NDK r26b
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r26b }
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust libs
        run: |
          mkdir -p rust-libs
          cargo ndk -t arm64-v8a -o rust-libs build --release \
            --manifest-path base/Cargo.toml || true
          ls rust-libs/arm64-v8a || true
      - name: Gradle wrapper 8.4
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradlew <<'EOF'
          #!/usr/bin/env bash
          exec java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
