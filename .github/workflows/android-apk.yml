name: Android APK
on:
  workflow_dispatch:
    inputs:
      arch: { description: 'ABI', required: false, default: 'arm64' }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Setup NDK r26b
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r26b }
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust libs
        run: |
          mkdir -p rust-libs
          cargo ndk -t arm64-v8a -o rust-libs build --release \
            --manifest-path base/Cargo.toml || true
          ls rust-libs/arm64-v8a || true
      - name: Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.4
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
